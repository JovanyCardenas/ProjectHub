{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl px-6 py-10">
  <div class="rounded-2xl border border-red-200 bg-white p-6 shadow-xl shadow-red-100/40">
    <h1 class="text-2xl font-bold text-gray-900">Remove Technology</h1>

    <p class="mt-3 text-gray-600">
      Remove this technology from the project?
    </p>

    <div class="mt-4 rounded-lg bg-gray-50 p-4">
      <p class="font-semibold text-gray-900">
        {{ project_technology.technology.name }}
      </p>
      <p class="mt-1 text-sm text-gray-600">
        {{ project_technology.technology.get_tech_type_display }}
      </p>
    </div>

    <form method="post" class="mt-6 flex justify-end gap-3">
      {% csrf_token %}

      <a href="{% url 'projects:project_detail' project.pk %}"
         class="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-100">
        Cancel
      </a>

      <button type="submit"
              class="rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700">
        Remove Technology
      </button>
    </form>
  </div>
</div>
{% endblock %}
